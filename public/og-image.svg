  <text x="455" y="310" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">,</text>
  <text x="475" y="310" fill="#ce9178" font-family="'Fira Code', monospace" font-size="16">"TypeScript"</text>
  <text x="620" y="310" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">,</text>
  <text x="300" y="340" fill="#ce9178" font-family="'Fira Code', monospace" font-size="16">"React"</text>
  <text x="380" y="340" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">,</text>
  <text x="400" y="340" fill="#ce9178" font-family="'Fira Code', monospace" font-size="16">"Docker"</text>
  <text x="495" y="340" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">,</text>
