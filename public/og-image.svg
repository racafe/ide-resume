  <text x="420" y="280" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">[</text>
  <text x="300" y="310" fill="#ce9178" font-family="'Fira Code', monospace" font-size="16">"C#"</text>
  <text x="360" y="310" fill="#d4d4d4" font-family="'Fira Code', monospace" font-size="16">,</text>
